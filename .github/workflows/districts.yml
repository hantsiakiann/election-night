# One-time (or occasional) job: download the Census Bureau's congressional district
# boundaries and commit them as site/geo/districts.json for the House geographic map.
# Run from the Actions tab: "Build district map" > Run workflow.
name: Build district map

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Census cartographic boundary zip (119th Congress, 1:20m)"
        default: "https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_cd119_20m.zip"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        working-directory: tools
        run: npm install --no-audit --no-fund
      - name: Download boundaries
        run: |
          mkdir -p /tmp/cd && cd /tmp/cd
          curl -fsSL --retry 3 -o cd.zip "${{ inputs.url }}"
          unzip -o -q cd.zip
          ls -la
      - name: Download 2026 maps for redrawn states
        run: |
          mkdir -p /tmp/ov
          jq -c '.states[]' tools/district_overrides.json | while read -r s; do
            st=$(echo "$s" | jq -r .state); url=$(echo "$s" | jq -r .url); type=$(echo "$s" | jq -r .type)
            echo "== $st ($type) $url"
            if [ "$type" = "planscore" ] || [ "$type" = "arcgis" ]; then
              curl -fsSL --compressed --retry 3 -A "Mozilla/5.0" -o "/tmp/ov/$st.geojson" "$url" || echo "!! $st download failed"
            else
              mkdir -p "/tmp/ovz/$st" && curl -fsSL --retry 3 -A "Mozilla/5.0" -o "/tmp/ovz/$st.zip" "$url" \
                && unzip -o -q "/tmp/ovz/$st.zip" -d "/tmp/ovz/$st" || { echo "!! $st download failed"; continue; }
              shp=$(find "/tmp/ovz/$st" -iname '*.shp' | head -1)
              [ -n "$shp" ] && npx --prefix tools mapshaper -i "$shp" -proj wgs84 -o format=geojson "/tmp/ov/$st.geojson" \
                || echo "!! $st conversion failed"
            fi
          done
          ls -la /tmp/ov
      - name: Clip 2026 maps to the coastline
        # Plan files often include offshore water (Census blocks extend into it); clip each to the
        # state's outline from the Census cartographic file so the coast matches the other states.
        run: |
          SHP=$(ls /tmp/cd/*.shp | head -1); mkdir -p /tmp/clip
          for f in /tmp/ov/*.geojson; do
            st=$(basename "$f" .geojson)
            fips=$(node -e "const m={AL:'01',AZ:'04',CA:'06',FL:'12',GA:'13',LA:'22',MO:'29',NC:'37',OH:'39',SC:'45',TN:'47',TX:'48',UT:'49',VA:'51'};console.log(m['$st']||'')")
            [ -z "$fips" ] && { echo "!! no FIPS for $st"; continue; }
            npx --prefix tools mapshaper -i "$SHP" -filter "STATEFP=='$fips'" -dissolve -proj wgs84 -o "/tmp/clip/$st.json" \
              && npx --prefix tools mapshaper -i "$f" -each 'ORDER_IDX=this.id' -clip "/tmp/clip/$st.json" -o force "$f" \
              || echo "!! $st clip failed (unclipped file kept)"
          done
      - name: Convert
        run: |
          SHP=$(ls /tmp/cd/*.shp | head -1)
          node tools/build_districts.mjs "$SHP" /tmp/ov site/geo/districts.json
          ls -la site/geo/districts.json
      - name: Commit
        run: |
          git config user.name "hantsiakiann"
          git config user.email "hantsiakiann@gmail.com"
          git add site/geo/districts.json site/geo/districts_report.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Update congressional district boundaries from Census"
          git push
          gh workflow run update.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
