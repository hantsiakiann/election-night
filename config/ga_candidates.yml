amendments:
- title: Amendment 1
  subtitle: 'Conservation use property: raise the acreage cap'
  yes_means: Raises the most land one owner can enroll in the conservation-use property tax program from 2,000 to 4,000 acres.
- title: Amendment 2
  subtitle: Nonpartisan probate judge elections
  yes_means: Requires probate judges to be elected in nonpartisan elections.
- title: Amendment 3
  subtitle: Next Generation 9-1-1 Fund
  yes_means: Lets the General Assembly create a dedicated, nonlapsing fund for 9-1-1 systems from existing revenues such as the wireless 911 fee.
