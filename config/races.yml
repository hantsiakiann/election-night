    WV: "https://sos.wv.gov/elections/"
    WI: "https://elections.wi.gov/elections/election-results"
    WY: "https://sos.wyo.gov/Elections/"

# ---------------------------------------------------------------- Georgia tab
georgia:
  majority_rule: true        # flag leaders under 50% (Georgia general-election runoff Dec 1)
  # Sections, in display order. Each statewide contest goes in the first section whose
  # pattern matches its name. `collapsed: true` sections start folded (the legislature).
  sections:
    - {name: "U.S. Senate & Governor", match: "^(US|U\\.S\\.) Senate|^Governor$", collapsed: false}
    - {name: "Statewide offices", match: "Lieutenant Governor|Secretary of State|Attorney General|Agriculture|Insurance|Labor|School Superintendent", collapsed: false}
    - {name: "U.S. House", match: "^(US|U\\.S\\.) (House|Rep)", collapsed: false}
    - {name: "Public Service Commission", match: "Public Service|PSC", collapsed: false}
    - {name: "Ballot measures", match: "Amendment|Referendum|Question|Constitutional|^Statewide", collapsed: false}
    - {name: "Courts", match: "Supreme Court|Court of Appeals|Justice|Judge", collapsed: true}
    - {name: "State Senate", match: "^State Senat", collapsed: true}
    - {name: "State House", match: "^State (House|Rep)", collapsed: true}
    - {name: "Other", match: ".*", collapsed: true}
  # Contests whose county-level split is shown at the top of each Metro Atlanta county.
  county_top_of_ticket: "^(US|U\\.S\\.) Senate|^Governor$|Lieutenant Governor"

# ---------------------------------------------------------------- Metro Atlanta tab
metro:
  counties: [Fulton, DeKalb, Cobb, Gwinnett, Clayton]
