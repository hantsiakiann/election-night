# Election night tracker config. Edit freely; the fetcher re-reads it on every run.
#
# Race `contest:` values are case-insensitive regular expressions matched against the
# contest names in that source's feed. After changing anything, run
#   python -m fetcher.run --list-contests
# to print every contest name each source actually publishes.

election_date: "2026-11-03"
title: "Election Night 2026"
# Where the tracker is served. Used to recover last good numbers if a source fails mid-night.
site_url: "https://hantsiakiann.github.io/election-night"
refresh_seconds: 60          # how often each open browser re-checks for new data

sources:
  georgia:
    type: enhanced_voting
    # Set this once the Secretary of State posts the Nov 3 election (usually days before).
    # It's the last part of the URL at results.sos.ga.gov/results/public/Georgia/elections/<ID>
    # Past IDs for reference: GeneralPrimary51926, 08252026SpecialElectionRunoff
    election_id: ""
    base: "https://results.sos.ga.gov/cdn/results/Georgia"
    page: "https://results.sos.ga.gov/results/public/Georgia/elections/{election_id}"
  nc:
    type: ncsbe
    url: "https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03/results_pct_20261103.zip"
    page: "https://er.ncsbe.gov/?election_dt=11/03/2026&county_id=0&office=FED&contest=0"
  mn:
    type: mn_sos
    # Unverified for 2026: confirm the path on the MN SOS results site on election day.
    base: "https://electionresultsfiles.sos.mn.gov/20261103/"
    files: [ussenate.txt, ushouse.txt, stateoffice.txt]
    page: "https://electionresults.sos.mn.gov/"
  # Template for any state that turns out to publish JSON (see fetcher/sources/json_map.py):
  # az:
  #   type: json_map
  #   url: "https://..."
  #   page: "https://results.arizona.vote/"
  #   contests: "Contests"
  #   contest_name: "Name"
  #   candidates: "Candidates"
  #   cand_name: "Name"
  #   cand_votes: "Votes"
  #   cand_party: "Party"
  #   precincts_reporting: "PrecinctsReporting"
  #   precincts_total: "Precincts"

# ---------------------------------------------------------------- National tab
# Every 2026 Senate (35), governor (36) and House (435) race is generated automatically.
# A state's races pull from a feed only if the state is listed under `feeds`; all others
# show a link to `links` and can be filled in through config/manual.yml.
national:
  feeds: {GA: georgia, NC: nc, MN: mn}
  # Contest-name patterns per source; {n} is the district number (01 and 1 both match).
  patterns:
    georgia:
      senate: "^(US|U\\.S\\.) Senate"
      governor: "^Governor$"
      house: "^(US|U\\.S\\.) (House of Representatives|Representative) - District 0?{n}$"
    nc:
      senate: "^US SENATE$"
      house: "^US HOUSE OF REPRESENTATIVES DISTRICT 0?{n}$"
    mn:
      senate: "U\\.?S\\.? Senat"
      governor: "^Governor"
      house: "U\\.?S\\.? Representative District 0?{n}$"
  # Seats not up this year, for the Senate control bar (current Senate: 53 R, 47 D incl. 2 independents).
  senate_holdovers: {D: 34, R: 31}
  # Party holding each governorship now (Oct 2026). Seats not up in 2026 count toward the
  # governor tally; up seats show the current holder in muted color until votes come in.
  governor_party: {AL: R, AK: R, AZ: D, AR: R, CA: D, CO: D, CT: D, DE: D, FL: R, GA: R, HI: D, ID: R,
                   IL: D, IN: R, IA: R, KS: D, KY: D, LA: R, ME: D, MD: D, MA: D, MI: D, MN: D, MS: R,
                   MO: R, MT: R, NE: R, NV: R, NH: R, NJ: D, NM: D, NY: D, NC: D, ND: R, OH: R, OK: R,
                   OR: D, PA: D, RI: D, SC: R, SD: R, TN: R, TX: R, UT: R, VT: R, VA: D, WA: D, WV: R,
                   WI: D, WY: R}
  # Party holding each Senate seat that's up in 2026 (Cook Political Report seat list).
  senate_party: {CO: D, DE: D, IL: D, MA: D, NJ: D, NM: D, OR: D, RI: D, VA: D, GA: D, MN: D, NH: D, MI: D,
                 NC: R, AK: R, IA: R, KS: R, ME: R, OH: R, TX: R, SC: R, MS: R, NE: R, AL: R, AR: R, FL: R,
                 ID: R, KY: R, LA: R, MT: R, OK: R, SD: R, TN: R, WV: R, WY: R}
  # Races settled before Election Day (source: 270toWin uncontested-races list, Sept 2026).
  #   winner + party: only one candidate on the ballot (counted as won)
  #   party only: every candidate on the ballot is from that party (seat counted for the party)
  #   note only: shown on the card, not counted
  decided:
    H-FL-10: {winner: "Maxwell Frost", party: D, reason: "Unopposed"}
    H-MA-02: {winner: "James McGovern", party: D, reason: "Unopposed"}
    H-MA-05: {winner: "Katherine Clark", party: D, reason: "Unopposed"}
    H-MA-07: {winner: "Ayanna Pressley", party: D, reason: "Unopposed"}
    H-WI-02: {winner: "Mark Pocan", party: D, reason: "Unopposed"}
    H-CA-04: {party: D, reason: "Both finalists are Democrats"}
    H-CA-07: {party: D, reason: "Both finalists are Democrats"}
    H-CA-11: {party: D, reason: "Both finalists are Democrats"}
    H-CA-12: {party: D, reason: "Both finalists are Democrats"}
    H-CA-14: {party: D, reason: "Both finalists are Democrats"}
    H-CA-29: {party: D, reason: "Both finalists are Democrats"}
    H-CA-34: {party: D, reason: "Both finalists are Democrats"}
    H-CA-37: {party: D, reason: "Both finalists are Democrats"}
    H-CA-40: {party: R, reason: "Both finalists are Republicans"}
    H-LA-02: {note: "No major-party opponent"}
    H-MA-01: {note: "No major-party opponent"}
    H-NJ-08: {note: "No major-party opponent"}
    H-PA-03: {note: "No major-party opponent"}
  senate_control: 51            # 50 + vice president's tiebreak goes to R; shown as a note
  house_control: 218
  # Key races, shown by default; "All races" lists everything.
  key:
    senate: [GA, NC, MI, ME, OH, TX, IA, AK, NH, MN, NE]
    governor: [GA, MI, NV, OH, AK, AZ, WI, IA, KS, OR, TX]
    house: [NY-17, NY-03, PA-01, PA-08, PA-10, WA-03, CA-13, IA-01, NE-02, CO-08, OH-09, OH-10, OH-15,
            TX-28, TX-35, FL-13, FL-22, FL-25, NC-01, NC-11, KY-06, AR-02, AL-02]
  notes:
    ME: "Maine has no state election-night feed"
    NH: "New Hampshire has no state election-night feed"
    WI: "Wisconsin has no state election-night feed"
    TX: "Texas's machine feed is paid; web results only"
  # Official results pages, used when a state has no feed. Verify before election night.
  links:
    AL: "https://www.sos.alabama.gov/alabama-votes"
    AK: "https://www.elections.alaska.gov/"
    AZ: "https://results.arizona.vote/"
    AR: "https://www.sos.arkansas.gov/elections/"
    CA: "https://electionresults.sos.ca.gov/"
    CO: "https://www.sos.state.co.us/pubs/elections/"
    CT: "https://portal.ct.gov/sots/election-services"
    DE: "https://elections.delaware.gov/"
    FL: "https://results.elections.myflorida.com/"
    GA: "https://results.sos.ga.gov/"
    HI: "https://elections.hawaii.gov/"
    ID: "https://voteidaho.gov/"
    IL: "https://www.elections.il.gov/"
    IN: "https://enr.indianavoters.in.gov/"
    IA: "https://electionresults.iowa.gov/"
    KS: "https://sos.ks.gov/elections/elections.html"
    KY: "https://elect.ky.gov/results/"
    LA: "https://voterportal.sos.la.gov/graphical"
    ME: "https://www.maine.gov/sos/cec/elec/results/index.html"
    MD: "https://elections.maryland.gov/"
    MA: "https://electionstats.state.ma.us/"
    MI: "https://www.michigan.gov/sos/elections"
    MN: "https://electionresults.sos.mn.gov/"
    MS: "https://www.sos.ms.gov/elections-voting"
    MO: "https://www.sos.mo.gov/elections"
    MT: "https://electionresults.mt.gov/"
    NE: "https://electionresults.nebraska.gov/"
    NV: "https://silverstateelection.nv.gov/"
    NH: "https://www.sos.nh.gov/elections"
    NJ: "https://www.nj.gov/state/elections/"
    NM: "https://electionresults.sos.nm.gov/"
    NY: "https://www.elections.ny.gov/"
    NC: "https://er.ncsbe.gov/"
    ND: "https://results.sos.nd.gov/"
    OH: "https://liveresults.ohiosos.gov/"
    OK: "https://results.okelections.gov/"
    OR: "https://results.oregonvotes.gov/"
    PA: "https://www.electionreturns.pa.gov/"
    RI: "https://elections.ri.gov/"
    SC: "https://electionresults.scvotes.gov/"
    SD: "https://electionresults.sd.gov/"
    TN: "https://sos.tn.gov/elections"
    TX: "https://results.texas-election.com/races"
    UT: "https://electionresults.utah.gov/"
    VT: "https://electionarchive.vermont.gov/"
