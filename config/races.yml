# Election night tracker config. Edit freely; the fetcher re-reads it on every run.
#
# Race `contest:` values are case-insensitive regular expressions matched against the
# contest names in that source's feed. After changing anything, run
#   python -m fetcher.run --list-contests
# to print every contest name each source actually publishes.

election_date: "2026-11-03"
title: "Election Night 2026"
# Where the tracker is served. Used to recover last good numbers if a source fails mid-night.
site_url: "https://hantsiakiann.github.io/election-night"
refresh_seconds: 60          # how often each open browser re-checks for new data

sources:
  georgia:
    type: enhanced_voting
    # Leave election_id blank: the fetcher looks up the Nov 3 election in the state's election
    # list (results.sos.ga.gov/results/public/api/jurisdictions/Georgia) by election_date. Set it
    # only to force a specific election (the last part of .../Georgia/elections/<ID>).
    # Past IDs for reference: GeneralPrimary51926, 08252026SpecialElectionRunoff
    election_id: ""
    election_date: "2026-11-03"
    base: "https://results.sos.ga.gov/cdn/results/Georgia"
    page: "https://results.sos.ga.gov/results/public/Georgia/elections/{election_id}"
  nc:
    type: ncsbe
    url: "https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03/results_pct_20261103.zip"
    page: "https://er.ncsbe.gov/?election_dt=11/03/2026&county_id=0&office=FED&contest=0"
  mn:
    type: mn_sos
    # Verified Nov 1, 2026: zero-vote files are posted at this path (governor is governor.txt).
    base: "https://electionresultsfiles.sos.mn.gov/20261103/"
    files: [ussenate.txt, ushouse.txt, governor.txt]
    page: "https://electionresults.sos.mn.gov/"
  # Added Nov 1, 2026; each checked against the state's zero-vote Nov 3 file (fetcher/sources/state_feeds.py).
  ut:
    type: enhanced_voting        # same platform and export format as Georgia
    base: "https://electionresults.utah.gov/cdn/results/Utah"
    election_id: ""
    election_date: "2026-11-03"  # resolves to General11032026
    page: "https://electionresults.utah.gov/results/public/Utah/elections/{election_id}"
  id:
    type: enhanced_voting        # same platform as Georgia and Utah; jurisdiction "id"
    base: "https://results.voteidaho.gov/cdn/results/id"
    election_id: ""
    election_date: "2026-11-03"  # resolves to nov2026
    page: "https://results.voteidaho.gov/results/public/id/elections/{election_id}"
  oh:
    type: nist1500               # NIST SP 1500-100 XML (marked IsTest until election night)
    url: "https://liveresults.ohiosos.gov/Api/v1/download?filename=VSSC1622XmlFileBlob"
    page: "https://liveresults.ohiosos.gov/"
  fl:
    type: fl_dos
    url: "https://flelectionfiles.floridados.gov/enightfilespublic/20261103_ElecResultsFL.txt"
    page: "https://results.elections.myflorida.com/"
  ca:
    type: ca_sos
    urls:
      - "https://media.sos.ca.gov/media/governor.json"
      - "https://media.sos.ca.gov/media/us-rep.json"
      - "https://media.sos.ca.gov/media/ballot-measures.json"
    page: "https://electionresults.sos.ca.gov/"
  la:
    type: la_sos
    base: "https://voterportal.sos.la.gov/ElectionResults/ElectionResults/Data?blob=20261103/"
    page: "https://voterportal.sos.la.gov/graphical"
  ne:
    type: results_csv
    urls: ["https://electionresults.nebraska.gov/resultsCSV.aspx?text=All&type=All&map=CTY"]
    page: "https://electionresults.nebraska.gov/"
  sd:
    type: results_csv
    urls:
      - "https://electionresults.sd.gov/resultsCSV.aspx?text=All&type=SWR&map=CTY"
      - "https://electionresults.sd.gov/resultsCSV.aspx?text=All&type=BQ&map=CTY"
    page: "https://electionresults.sd.gov/"
  nm:
    type: results_csv
    urls:
      - "https://electionresults.sos.nm.gov/resultsCSV.aspx?text=All&type=FED&map=CTY"
      - "https://electionresults.sos.nm.gov/resultsCSV.aspx?text=All&type=SW&map=CTY"
    page: "https://electionresults.sos.nm.gov/"
  vt:
    type: vt_sos
    election_date: "2026-11-03"
    groups: [federal, stateWide]
    page: "https://electionresults.vermont.gov/"
  or:
    type: or_sos
    url: "https://results.oregonvotes.gov/ResultsExport.aspx"
    election_date_text: "11/3/2026"
    targets: ["ctl00$MainContent$Statewide", "ctl00$MainContent$Governor"]
    page: "https://results.oregonvotes.gov/"
  tx:
    type: tx_sos
    election_date: "2026-11-03"   # picks the 2026 general from the state's election list once posted
    election_name: "GENERAL ELECTION"
    user_agent: browser           # the Texas site returns 403 to non-browser user agents
    page: "https://results.texas-election.com/races"
  in:
    type: in_sos
    base: "https://enr.indianavoters.in.gov/site/data"
    election_date_text: "11/03/2026"
    categories: [1005]            # U.S. House (no Senate or governor race in Indiana this year)
    page: "https://enr.indianavoters.in.gov/"
  pa:
    type: pa_sos
    election_date: "2026-11-03"   # resolves to election 117 via GetLatestElection
    offices: [11]                 # U.S. House; the governor comes from the statewide summary
    house_county_breaks: [1, 7, 8, 10]   # county detail for the competitive districts
    page: "https://www.electionreturns.pa.gov/"
  # Template for any state that turns out to publish JSON (see fetcher/sources/json_map.py):
  # az:
  #   type: json_map
  #   url: "https://..."
  #   page: "https://results.arizona.vote/"
  #   contests: "Contests"
  #   contest_name: "Name"
  #   candidates: "Candidates"
  #   cand_name: "Name"
  #   cand_votes: "Votes"
  #   cand_party: "Party"
  #   precincts_reporting: "PrecinctsReporting"
  #   precincts_total: "Precincts"

# ---------------------------------------------------------------- National tab
# Every 2026 Senate (35), governor (36) and House (435) race is generated automatically.
# A state's races pull from a feed only if the state is listed under `feeds`; all others
# show a link to `links` and can be filled in through config/manual.yml.
national:
  feeds: {GA: georgia, NC: nc, MN: mn, UT: ut, OH: oh, FL: fl, CA: ca, LA: la, NE: ne, SD: sd, NM: nm, VT: vt, OR: or, PA: pa, ID: id, IN: in, TX: tx}
  # Contest-name patterns per source; {n} is the district number (01 and 1 both match).
  patterns:
    georgia:
      senate: "^(US|U\\.S\\.) Senate"
      governor: "^Governor$"
      house: "^(US|U\\.S\\.) (House of Representatives|Representative) - District 0?{n}$"
    nc:
      senate: "^US SENATE$"
      house: "^US HOUSE OF REPRESENTATIVES DISTRICT 0?{n}$"
    mn:
      senate: "U\\.?S\\.? Senat"
      governor: "^Governor"
      house: "U\\.?S\\.? Representative District 0?{n}$"
    ut:
      house: "^U\\.S\\. House District 0?{n}$"
    oh:
      senate: "^U\\.S\\. Senator$"
      governor: "^Governor and Lieutenant Governor$"
      house: "^Representative to Congress - District 0?{n}$"
    fl:
      senate: "^United States Senator$"
      governor: "^Governor and Lieutenant Governor$"
      house: "^Representative in Congress, District 0?{n}$"
    ca:
      governor: "^Governor$"
      house: "^United States Representative District 0?{n}$"
    la:
      senate: "^U\\. ?S\\. Senator$"
      house: "^U\\. ?S\\. Representative -- 0?{n}(st|nd|rd|th) Congressional District$"
    ne:
      senate: "^For United States Senator"
      governor: "^For Governor"
      house: "^For Representative in Congress.* District 0?{n}$"
    sd:
      senate: "^United States Senator$"
      governor: "^Governor and Lieutenant Governor$"
      house: "^United States Representative$"
    nm:
      senate: "^United States Senator$"
      governor: "^Governor and Lieutenant Governor$"
      house: "^United States Representative District 0?{n}$"
    vt:
      governor: "^GOVERNOR$"
      house: "^REPRESENTATIVE TO CONGRESS$"
    or:
      senate: "^US Senator$"
      governor: "^Governor$"
      house: "^US Representative, 0?{n}(st|nd|rd|th) District$"
    id:
      senate: "^United States Senator$"
      governor: "^Governor$"
      house: "^United States Representative District 0?{n}$"
    tx:
      senate: "^U\\. ?S\\. SENATOR"
      governor: "^GOVERNOR$"
      house: "^U\\. ?S\\. REPRESENTATIVE DISTRICT 0?{n}$"
    in:
      house: "^United States Representative, \\(0?{n}\\) District$"
    pa:
      governor: "^Governor$"
      house: "^Representative in Congress - 0?{n}(st|nd|rd|th) Congressional District$"
  # Seats not up this year, for the Senate control bar (current Senate: 53 R, 47 D incl. 2 independents).
  senate_holdovers: {D: 34, R: 31}
  # Party holding each governorship now (Oct 2026). Seats not up in 2026 count toward the
  # governor tally; up seats show the current holder in muted color until votes come in.
  governor_party: {AL: R, AK: R, AZ: D, AR: R, CA: D, CO: D, CT: D, DE: D, FL: R, GA: R, HI: D, ID: R,
                   IL: D, IN: R, IA: R, KS: D, KY: D, LA: R, ME: D, MD: D, MA: D, MI: D, MN: D, MS: R,
                   MO: R, MT: R, NE: R, NV: R, NH: R, NJ: D, NM: D, NY: D, NC: D, ND: R, OH: R, OK: R,
                   OR: D, PA: D, RI: D, SC: R, SD: R, TN: R, TX: R, UT: R, VT: R, VA: D, WA: D, WV: R,
                   WI: D, WY: R}
  # Party holding each Senate seat that's up in 2026 (Cook Political Report seat list).
  senate_party: {CO: D, DE: D, IL: D, MA: D, NJ: D, NM: D, OR: D, RI: D, VA: D, GA: D, MN: D, NH: D, MI: D,
                 NC: R, AK: R, IA: R, KS: R, ME: R, OH: R, TX: R, SC: R, MS: R, NE: R, AL: R, AR: R, FL: R,
                 ID: R, KY: R, LA: R, MT: R, OK: R, SD: R, TN: R, WV: R, WY: R}
  # States with no Senate race in 2026: party of their two senators (split = one of each).
  # Sanders (I-VT) caucuses with Democrats. Source: list of current senators, Oct 2026.
  senate_not_up: {AZ: D, CA: D, CT: D, HI: D, IN: R, MD: D, MO: R, NV: D, NY: D, ND: R, PA: split,
                  UT: R, VT: D, WA: D, WI: split}
  # States whose 2026 House district lines are new (mid-decade redistricting) and so aren't in
  # the Census 2024 boundary file. The geographic House map shades these states by seat
  # share instead of drawing district lines. Source: Ballotpedia, Oct 2026.
  house_new_lines: []   # all redrawn states now have 2026 lines (tools/district_overrides.json)
  # Forecaster ratings for every race are in config/ratings.yml (tools/build_ratings.py).
  # Races settled before Election Day (source: 270toWin uncontested-races list, Sept 2026).
  #   winner + party: only one candidate on the ballot (counted as won)
  #   party only: every candidate on the ballot is from that party (seat counted for the party)
  #   note only: shown on the card, not counted
  decided:
    H-FL-10: {winner: "Maxwell Frost", party: D, reason: "Unopposed"}
    H-MA-02: {winner: "James McGovern", party: D, reason: "Unopposed"}
    H-MA-07: {winner: "Ayanna Pressley", party: D, reason: "Unopposed"}
    H-WI-02: {winner: "Mark Pocan", party: D, reason: "Unopposed"}
    H-CA-04: {party: D, reason: "Both finalists are Democrats"}
    H-CA-07: {party: D, reason: "Both finalists are Democrats"}
    H-CA-11: {party: D, reason: "Both finalists are Democrats"}
    H-CA-12: {party: D, reason: "Both finalists are Democrats"}
    H-CA-14: {party: D, reason: "Both finalists are Democrats"}
    H-CA-29: {party: D, reason: "Both finalists are Democrats"}
    H-CA-34: {party: D, reason: "Both finalists are Democrats"}
    H-CA-37: {party: D, reason: "Both finalists are Democrats"}
    H-CA-40: {party: R, reason: "Both finalists are Republicans"}
    H-LA-02: {note: "No major-party opponent"}
    H-MA-01: {note: "No major-party opponent"}
    H-NJ-08: {note: "No major-party opponent"}
    H-PA-03: {note: "No major-party opponent"}
  senate_control: 51            # 50 + vice president's tiebreak goes to R; shown as a note
  house_control: 218
  # Key races, shown by default; "All races" lists everything.
  # Senate/governor races rated Toss-up, Tilt or Lean by any forecaster are added automatically.
  key:
    senate: [GA, NC, MI, ME, OH, TX, IA, AK, NH, MN, NE]
    governor: [GA, MI, NV, OH, AK, AZ, WI, IA, KS, OR, TX]
    house: [AK-AL, AL-02, AR-02, AZ-01, AZ-02, AZ-06, CA-06, CA-13, CA-22, CA-48, CO-04, CO-05,
            CO-08, FL-13, FL-14, FL-22, FL-25, FL-27, IA-01, IA-02, IA-03, KY-06, ME-02, MI-04,
            MI-07, MI-10, MN-01, MO-02, MT-01, NC-01, NC-11, NE-02, NH-01, NJ-07, NM-02, NV-01,
            NV-02, NV-03, NY-03, NY-04, NY-17, NY-21, OH-01, OH-07, OH-09, OH-10, OH-15, PA-01,
            PA-07, PA-08, PA-10, SC-01, TX-15, TX-23, TX-28, TX-34, TX-35, VA-01, VA-02, VA-05,
            WA-03, WI-01, WI-03]
  notes:
    ME: "Maine has no state election-night feed"
    NH: "New Hampshire has no state election-night feed"
    WI: "Wisconsin has no state election-night feed"
    TX: "Texas's machine feed is paid; web results only"
  # Official results pages, used when a state has no feed. Verify before election night.
  links:
    AL: "https://www.sos.alabama.gov/alabama-votes"
    AK: "https://www.elections.alaska.gov/"
    AZ: "https://results.arizona.vote/"
    AR: "https://www.sos.arkansas.gov/elections/"
    CA: "https://electionresults.sos.ca.gov/"
    CO: "https://www.sos.state.co.us/pubs/elections/"
    CT: "https://portal.ct.gov/sots/election-services"
    DE: "https://elections.delaware.gov/"
    FL: "https://results.elections.myflorida.com/"
    GA: "https://results.sos.ga.gov/"
    HI: "https://elections.hawaii.gov/"
    ID: "https://voteidaho.gov/"
    IL: "https://www.elections.il.gov/"
    IN: "https://enr.indianavoters.in.gov/"
    IA: "https://electionresults.iowa.gov/"
    KS: "https://sos.ks.gov/elections/elections.html"
    KY: "https://elect.ky.gov/results/"
    LA: "https://voterportal.sos.la.gov/graphical"
    ME: "https://www.maine.gov/sos/cec/elec/results/index.html"
    MD: "https://elections.maryland.gov/"
    MA: "https://electionstats.state.ma.us/"
    MI: "https://www.michigan.gov/sos/elections"
    MN: "https://electionresults.sos.mn.gov/"
    MS: "https://www.sos.ms.gov/elections-voting"
    MO: "https://www.sos.mo.gov/elections"
    MT: "https://electionresults.mt.gov/"
    NE: "https://electionresults.nebraska.gov/"
    NV: "https://silverstateelection.nv.gov/"
    NH: "https://www.sos.nh.gov/elections"
    NJ: "https://www.nj.gov/state/elections/"
    NM: "https://electionresults.sos.nm.gov/"
    NY: "https://www.elections.ny.gov/"
    NC: "https://er.ncsbe.gov/"
    ND: "https://results.sos.nd.gov/"
    OH: "https://liveresults.ohiosos.gov/"
    OK: "https://results.okelections.gov/"
    OR: "https://results.oregonvotes.gov/"
    PA: "https://www.electionreturns.pa.gov/"
    RI: "https://elections.ri.gov/"
    SC: "https://electionresults.scvotes.gov/"
    SD: "https://electionresults.sd.gov/"
    TN: "https://sos.tn.gov/elections"
    TX: "https://results.texas-election.com/races"
    UT: "https://electionresults.utah.gov/"
    VT: "https://electionarchive.vermont.gov/"
    VA: "https://enr.elections.virginia.gov/"
    WA: "https://results.vote.wa.gov/"
    WV: "https://sos.wv.gov/elections/"
    WI: "https://elections.wi.gov/elections/election-results"
    WY: "https://sos.wyo.gov/Elections/"

# ---------------------------------------------------------------- Georgia tab
georgia:
  majority_rule: true        # flag leaders under 50% (Georgia general-election runoff Dec 1)
  # Sections, in display order. Each statewide contest goes in the first section whose
  # pattern matches its name. `tab` picks the Georgia sub-tab (statewide, senate, house, or
  # none to leave it off the Georgia tab);
  # `collapsed: true` sections start folded.
  sections:
    - {name: "U.S. Senate & Governor", match: "^(US|U\\.S\\.) Senate|^Governor$", tab: statewide}
    - {name: "Statewide offices", match: "Lieutenant Governor|Secretary of State|Attorney General|Agriculture|Insurance|Labor|School Superintendent", tab: statewide}
    - {name: "Public Service Commission", match: "Public Service|PSC", tab: statewide}
    - {name: "Ballot measures", match: "Amendment|Referendum|Question|Constitutional|^Statewide", tab: statewide}
    - {name: "U.S. House", match: "^(US|U\\.S\\.) (House|Rep)", tab: none}   # National tab only
    - {name: "Courts", match: "Supreme Court|Court of Appeals|Justice|Judge", tab: statewide, collapsed: true}
    - {name: "State Senate", match: "^State Senat", tab: senate}
    - {name: "State House", match: "^State (House|Rep)", tab: house}
    - {name: "Other", match: ".*", tab: statewide, collapsed: true}
  # Contests whose county-level split is shown at the top of each Metro Atlanta county.
  county_top_of_ticket: "^(US|U\\.S\\.) Senate|^Governor$|Lieutenant Governor"

# ---------------------------------------------------------------- Metro Atlanta tab
metro:
  counties: [Fulton, DeKalb, Cobb, Gwinnett, Clayton]
